name: Unit Testing

on:
  pull_request:
  workflow_dispatch:

# Explicitly restrict the default GITHUB_TOKEN to no permissions.
# All DAOS CI workflows follow this pattern (job-level permissions only),
# consistent with bullseye-coverage.yml, ci2.yml, landing-builds.yml, etc.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:

  standard:
    uses: ./.github/workflows/unit-test-template.yml
    with:
      test_mode: 'standard'
      sanitizers_build_arg: ''
      image_tag: 'build-standard'
      artifact_name: 'test-results-unit'
      check_name: 'Unit Testing'
    permissions:
      checks: write
      contents: read

  asan:
    uses: ./.github/workflows/unit-test-template.yml
    with:
      test_mode: 'asan'
      sanitizers_build_arg: 'address'
      image_tag: 'build-asan'
      artifact_name: 'test-results-asan'
      check_name: 'Unit Test Results (ASan build)'
    permissions:
      security-events: write
      checks: write
      contents: read

  # TSan is incompatible with ASan (separate build required). Argobots ULT
  # context switches may produce false race reports; add suppressions to
  # utils/test_tsan.supp as they are identified.
  tsan:
    uses: ./.github/workflows/unit-test-template.yml
    with:
      test_mode: 'tsan'
      sanitizers_build_arg: 'thread'
      image_tag: 'build-tsan'
      artifact_name: 'test-results-tsan'
      check_name: 'Unit Test Results (TSan build)'
    permissions:
      security-events: write
      checks: write
      contents: read

  # Uses a dedicated build image (SANITIZERS=undefined) so the UBSan runtime
  # never shares a log_path with ASan, which would corrupt UBSan log files.
  ubsan:
    uses: ./.github/workflows/unit-test-template.yml
    with:
      test_mode: 'ubsan'
      sanitizers_build_arg: 'undefined'
      image_tag: 'build-ubsan'
      artifact_name: 'test-results-ubsan'
      check_name: 'Unit Test Results (UBSan build)'
    permissions:
      security-events: write
      checks: write
      contents: read
