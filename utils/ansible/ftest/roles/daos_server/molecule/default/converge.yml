- hosts: all
  gather_facts: true
  vars:
    daos_sysctl_reload: false
    daos_hugepages_nb_default: 0
    daos_hugepages_nb: 0
    daos_hugepages_multiplier: 1024
    daos_ofi_provider_default: ofi+tcp
    # Disable GRUB update: containers have no real bootloader (grubby
    # would fail or find no kernels).  Only the sysctl phase is tested here.
    daos_grub_update_enabled: false
    # Proxy vars (subset of vars/defaults.yml) used to test the proxy mechanism
    daos_http_proxy: "http://test-proxy.example.com:3128"
    daos_proxy_bypass: "localhost,127.0.0.1"
    daos_proxy_nofwd: []
    daos_proxy_env:
      http_proxy: "http://test-proxy.example.com:3128"
      https_proxy: "http://test-proxy.example.com:3128"
      HTTP_PROXY: "http://test-proxy.example.com:3128"
      HTTPS_PROXY: "http://test-proxy.example.com:3128"
      no_proxy: "localhost,127.0.0.1"
      NO_PROXY: "localhost,127.0.0.1"
    daos_noproxy_env:
      http_proxy: ""
      https_proxy: ""
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      no_proxy: ""
      NO_PROXY: ""
  tasks:
    - name: Ensure /etc/systemd directories exist
      become: true
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /etc/systemd
        - /etc/systemd/system
        - /etc/sysctl.d
        - /etc/security/limits.d

    - name: Ensure /etc/systemd/system.conf exists
      become: true
      copy:
        dest: /etc/systemd/system.conf
        content: |
          [Manager]
          #DefaultLimitNOFILE=
          #DefaultLimitMEMLOCK=
        force: false
        mode: '0644'

    - name: Test server user and group creation
      block:
        - name: Include users_groups tasks
          include_role:
            name: daos_server
            tasks_from: users_groups.yml
      rescue:
        - name: Note user modification skipped
          debug:
            msg: "User/group modification skipped (user may be in active use in container)"

    - name: Test server limits configuration
      include_role:
        name: daos_server
        tasks_from: limits.yml

    - name: Test hugepages configuration (sysctl only; GRUB phase disabled)
      include_role:
        name: daos_server
        tasks_from: hugepages.yml

    - name: "GRUB idempotency test: create a fake /etc/default/grub (Debian-style)"
      become: true
      copy:
        dest: /etc/default/grub
        force: false
        mode: '0644'
        content: |
          GRUB_TIMEOUT=5
          GRUB_DEFAULT=saved
          GRUB_CMDLINE_LINUX="quiet splash"
          GRUB_CMDLINE_LINUX_DEFAULT=""

    - name: "GRUB idempotency test: install a no-op update-grub stub for container"
      become: true
      copy:
        dest: /usr/sbin/update-grub
        force: false
        mode: '0755'
        content: |
          #!/bin/bash
          # Stub: real update-grub is not available in a container.
          echo "stub update-grub: skipping real GRUB regeneration"
          exit 0

    - name: "GRUB idempotency test: run Debian hugepages update (os_family override)"
      vars:
        ansible_os_family: Debian
        daos_grub_update_enabled: true
        daos_sysctl_reload: false
      include_role:
        name: daos_server
        tasks_from: hugepages.yml

    - name: "GRUB idempotency test: run again to verify idempotency (no change)"
      vars:
        ansible_os_family: Debian
        daos_grub_update_enabled: true
        daos_sysctl_reload: false
      include_role:
        name: daos_server
        tasks_from: hugepages.yml

    # --- Proxy environment sentinel tests ---
    # Verify that daos_proxy_env forwards the proxy to tasks
    - name: "Proxy sentinel: capture http_proxy inside daos_proxy_env"
      command: bash -c 'printf "%s" "${http_proxy}"'
      register: _proxy_sentinel
      changed_when: false
      failed_when: false
      environment: "{{ daos_proxy_env }}"

    - name: "Proxy sentinel: assert http_proxy is set when using daos_proxy_env"
      assert:
        that: _proxy_sentinel.stdout == daos_http_proxy
        fail_msg: >-
          Expected http_proxy='{{ daos_http_proxy }}'
          but got '{{ _proxy_sentinel.stdout }}'

    # Verify that daos_noproxy_env clears the proxy (used for dnf exceptions)
    - name: "Proxy sentinel: capture http_proxy inside daos_noproxy_env"
      command: bash -c 'printf "%s" "${http_proxy}"'
      register: _noproxy_sentinel
      changed_when: false
      failed_when: false
      environment: "{{ daos_noproxy_env }}"

    - name: "Proxy sentinel: assert http_proxy is cleared when using daos_noproxy_env"
      assert:
        that: _noproxy_sentinel.stdout == ""
        fail_msg: >-
          Expected http_proxy='' (empty/cleared) for dnf exception
          but got '{{ _noproxy_sentinel.stdout }}'

    # Verify that daos_proxy_nofwd drives the correct environment choice for
    # include_tasks: dependencies.yml in daos_server/tasks/main.yml
    - name: "Proxy sentinel: resolve env dict with daos_proxy_nofwd: [dnf]"
      set_fact:
        _dnf_env: "{{ daos_noproxy_env if 'dnf' in (['dnf'] | default([])) else daos_proxy_env }}"

    - name: "Proxy sentinel: assert server dnf tasks bypass proxy when dnf is in daos_proxy_nofwd"
      assert:
        that: _dnf_env.http_proxy == ""
        fail_msg: >-
          Expected server dnf tasks to receive http_proxy='' when dnf is listed
          in daos_proxy_nofwd but got '{{ _dnf_env.http_proxy }}'
