syntax = "proto3";
package ctl;

option go_package = "github.com/daos-stack/daos/src/control/common/proto/ctl";

import "shared/ranks.proto";

// Generic request indicating which ranks to operate on.
// Used in gRPC fanout to operate on hosts with multiple ranks.
message RanksReq {
	bool force = 3; // force operation
	string ranks = 4; // rankset to operate over
	bool check_mode = 5; // start in check mode
}

// Generic response containing DER result from multiple ranks.
// Used in gRPC fanout to operate on hosts with multiple ranks.
message RanksResp {
	repeated shared.RankResult results = 1;
}

// Request to start every engine on a host.
message StartEnginesReq {}

// Per-instance start result.
message EngineResult
{
	uint32 index = 1; // engine instance index
	string state = 2; // local engine state after the request
	string error = 3; // why the engine exited instead of starting
	string uuid  = 4; // superblock UUID; empty until formatted
}

message StartEnginesResp
{
	repeated EngineResult results = 1; // one per requested instance
}
