syntax = "proto3";
package security;

option  go_package = "github.com/daos-stack/daos/src/control/security;security";

// PoPPayload is the signed proof-of-possession payload attached to pool
// connect credentials.
message PoPPayload
{
	bytes pool_uuid   = 1; // UUID (16 bytes) of the pool being connected
	bytes handle_uuid = 2; // UUID (16 bytes) of the new pool handle
	int64 timestamp   = 3; // Unix seconds when the proof was created
}
