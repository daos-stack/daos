# change host names to your reserved nodes, the
# required quantity is indicated by the placeholders
hosts:
  test_servers: 4

# REBUILD_WEEKLY1 takes ~8 minutes; raise this as subtests are added
timeout: 1200

server_config:
  name: daos_server
  engines_per_host: 2
  engines:
    0:
      pinned_numa_node: 0
      nr_xs_helpers: 1
      log_file: daos_server0.log
      log_mask: DEBUG,MEM=ERR
      env_vars:
        - DD_MASK=mgmt,io,md,epc,rebuild,any
        - D_LOG_FILE_APPEND_PID=1
        - D_LOG_FILE_APPEND_RANK=1
        - D_LOG_FLUSH=DEBUG
        - HG_LOG_LEVEL=warn
        - HG_LOG_SUBSYS=hg,na,libfabric
      storage: auto
    1:
      pinned_numa_node: 1
      nr_xs_helpers: 1
      log_file: daos_server1.log
      log_mask: DEBUG,MEM=ERR
      env_vars:
        - DD_MASK=mgmt,io,md,epc,rebuild,any
        - D_LOG_FILE_APPEND_PID=1
        - D_LOG_FILE_APPEND_RANK=1
        - D_LOG_FLUSH=DEBUG
        - HG_LOG_LEVEL=warn
        - HG_LOG_SUBSYS=hg,na,libfabric
      storage: auto
  transport_config:
    allow_insecure: true
  system_ram_reserved: 16

agent_config:
  transport_config:
    allow_insecure: true

dmg:
  transport_config:
    allow_insecure: true

pool:
  # This will create 8G of SCM and 16G of NVMe size of pool.
  scm_size: 8G
  nvme_size: 16G

daos_tests:
  num_clients:
    test_rebuild_weekly: 1
  test_name:
    test_rebuild_weekly: DAOS_Rebuild_Weekly
  daos_test:
    test_rebuild_weekly: k
  args:
    test_rebuild_weekly: -s5
  pools_created:
    test_rebuild_weekly: 1
