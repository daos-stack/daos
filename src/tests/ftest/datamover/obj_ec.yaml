hosts:
  test_servers: 3
  test_clients: 1

timeout: 300

timeouts:
  test_dm_obj_ec_cont_clone: 300
  test_dm_obj_ec_dcp: 300
  test_dm_obj_ec_dsync: 400
  test_dm_obj_ec_dserialize: 400

server_config:
  name: daos_server
  engines_per_host: 2
  engines:
    0:
      pinned_numa_node: 0
      nr_xs_helpers: 1
      log_file: daos_server0.log
      log_mask: ERR
      storage: auto
    1:
      pinned_numa_node: 1
      nr_xs_helpers: 1
      log_file: daos_server1.log
      log_mask: ERR
      storage: auto

pool:
  size: 95%

container:
  # OC_EC_2P1G1 tolerates one failure, the inherited default demands more
  properties: rd_fac:1,rd_lvl:rank

dcp:
  client_processes:
    np: 3

dsync:
  client_processes:
    np: 3

dserialize:
  client_processes:
    np: 3

ddeserialize:
  client_processes:
    np: 3

dataset:
  obj_class: OC_EC_2P1G1
  num_objs: 2
  num_dkeys: 2
  num_akeys: 2
  # OC_EC_2P1G1 is 2 data cells, and the default cell size is 128KiB, so a full
  # stripe is 256KiB. Whole stripes are written so parity is computed at update
  # time, then alternate stripes are punched, leaving that parity behind.
  stripe_size: 262144
  num_stripes: 4
  punch_stripes: [0, 2]
  # one akey per dkey has every stripe punched, so a listed extent returns no data
  # at all. That is a harder case than an akey that keeps some live stripes.
  full_punch_akeys: 1
