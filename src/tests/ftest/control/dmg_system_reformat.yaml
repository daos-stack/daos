hosts:
  test_servers: 3
  test_clients: 1
timeout: 300
setup: !mux
  single_replica:
    mgmt_svc_replicas_qty: 1
  multi_replica:
    mgmt_svc_replicas_qty: 3
server_config:
  engines_per_host: 1
  engines:
    0:
      storage: auto
  system_ram_reserved: 32
  variant: !mux
    standard:
      name: daos_server
    non_standard:
      name: daos_server_nonstd
      port: 10515
pool: !mux
  default:
    size: 90%
  md_on_ssd_p2:
    size: 90%
    mem_ratio: 25
