hosts:
  test_servers: 4
  test_clients: 1
timeout: 80
server_config:
  name: daos_server
  engines_per_host: 1
  engines:
    0:
      targets: 4
      nr_xs_helpers: 0
      storage:
        0:
          class: ram
          scm_mount: /mnt/daos
  system_ram_reserved: 1
pool:
  scm_size: 3G
  properties: rd_fac:0,space_rb:0
container:
  type: POSIX
  properties: cksum:off,srv_cksum:off
  class_names: !mux
    oclass_s1:
      oclass: S1
    oclass_rp_2g1:
      oclass: RP_2G1
    oclass_rp_3g1:
      oclass: RP_3G1
    oclass_rp_2g2:
      oclass: RP_2G2
