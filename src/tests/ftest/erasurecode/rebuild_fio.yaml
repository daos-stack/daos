hosts:
  test_servers: 4
  test_clients: 1

timeout: 1500

setup:
  start_agents_once: False
  start_servers_once: False

server_config:
  name: daos_server
  engines_per_host: 2
  engines:
    0:
      pinned_numa_node: 0
      nr_xs_helpers: 1
      log_file: daos_server0.log
      log_mask: ERR
      targets: 2
      storage: auto
    1:
      pinned_numa_node: 1
      nr_xs_helpers: 1
      log_file: daos_server1.log
      log_mask: ERR
      targets: 2
      storage: auto

pool:
  size: 100%
  aggregation_timeout: 180
  set_logmasks: False

container:
  type: POSIX
  properties: rd_fac:2,rd_lvl:node

fio:
  names:
    - test
  api: POSIX
  test:
    ioengine: libaio
    numjobs: 16
    verify: 'crc32'
    verify_backlog: 1024
    verify_pattern: '0xabcdabcd'
    do_verify: 1
    iodepth: 512
    size: 50G
    rw: 'write'
    rw_read: 'read'
    runtime: 480
    direct: 1

dfuse:
  disable_caching: True
