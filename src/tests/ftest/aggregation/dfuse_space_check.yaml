hosts:
  test_servers: 1
  test_clients: 1

timeout: 1500

server_config:
  name: daos_server
  engines_per_host: 1
  engines:
    0:
      targets: 1
      storage: auto

pool:
  scm_size: 200MB
  nvme_size: 1GiB  # Minimum for 1 target
  properties: "rd_fac:0,space_rb:0"

container:
  type: POSIX
  properties: "cksum:off,srv_cksum:off"

dfuse_space_check:
  block_size: 2097152  # 2M
