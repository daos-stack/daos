hosts:
  test_servers: 1
  test_clients: 1

timeout: 600

server_config:
  name: daos_server
  engines_per_host: 1
  engines:
    0:
      log_mask: INFO
      storage: auto

pool:
  scm_size: 8G
  nvme_size: 100G
  svcn: 1
  properties: rd_fac:0,space_rb:0

container:
  type: POSIX
  properties: cksum:off,srv_cksum:off

ior:
  env_vars:
    - D_LOG_MASK=INFO
    - DD_MASK=all
    - DD_SUBSYS=all
  api: POSIX
  client_processes:
    np: 16
  test_file: testFile
  repetitions: 1
  iorflags:
    flags: "-v -w -r -R"
  transfer_size: '1M'
  block_size: '100M'
  write_x: 2
  read_x: 1
  objectclass:
    dfs_oclass: "SX"

dfuse:
  disable_caching: true
