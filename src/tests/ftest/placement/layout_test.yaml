##
## Comprehensive layout_test performance matrix covering all supported
## redundant object classes (21 variants).
##
## Fixed topology: 32 nodes x 1 rank x 8 targets (256 targets total).
## This satisfies the minimum-node requirement for every class below,
## including the most demanding one (EC_16P3: needs 19 nodes).
##
## Non-redundant classes (S1, S2, SX, etc.) are intentionally excluded
## because exclude→reint is meaningless when there is no spare target.
##
## Object class mux structure:
##
##   Replication (5 factors, G1 and GX per factor = 10 variants):
##     RP_2, RP_3, RP_4, RP_5, RP_6
##
##   Erasure Coding (11 configurations, G1 per config = 11 variants):
##     2P1, 2P2, 4P1, 4P2, 4P3, 8P1, 8P2, 8P3, 16P1, 16P2, 16P3
##

timeouts:
  test_layout_performance: 300

# Fixed topology – adequate for all classes listed below
nodes: 32
ranks: 1
targets: 8

# Number of OIDs exercised per variant
obj_count: 100000

# Operation sequence applied to every variant
operation: "exclude node=[0],reint node=[0]"

# One variant per supported object class
object_class:
  !mux

  # -----------------------------------------------------------------------
  # Replication classes
  # G1  = 1 placement group  (minimum sharding)
  # GX  = max placement groups (stress the placement algorithm)
  # -----------------------------------------------------------------------

  rp2_g1:
    object_class: RP_2G1

  rp2_gx:
    object_class: RP_2GX

  rp3_g1:
    object_class: RP_3G1

  rp3_gx:
    object_class: RP_3GX

  rp4_g1:
    object_class: RP_4G1

  rp4_gx:
    object_class: RP_4GX

  rp5_g1:
    object_class: RP_5G1

  rp5_gx:
    object_class: RP_5GX

  rp6_g1:
    object_class: RP_6G1

  rp6_gx:
    object_class: RP_6GX

  # -----------------------------------------------------------------------
  # Erasure Coding classes  (k data + p parity, 1 placement group)
  # Minimum nodes required = k + p
  # -----------------------------------------------------------------------

  # 2+1 = 3 nodes minimum
  ec_2p1_g1:
    object_class: EC_2P1G1

  # 2+2 = 4 nodes minimum
  ec_2p2_g1:
    object_class: EC_2P2G1

  # 4+1 = 5 nodes minimum
  ec_4p1_g1:
    object_class: EC_4P1G1

  # 4+2 = 6 nodes minimum
  ec_4p2_g1:
    object_class: EC_4P2G1

  # 4+3 = 7 nodes minimum
  ec_4p3_g1:
    object_class: EC_4P3G1

  # 8+1 = 9 nodes minimum
  ec_8p1_g1:
    object_class: EC_8P1G1

  # 8+2 = 10 nodes minimum
  ec_8p2_g1:
    object_class: EC_8P2G1

  # 8+3 = 11 nodes minimum
  ec_8p3_g1:
    object_class: EC_8P3G1

  # 16+1 = 17 nodes minimum
  ec_16p1_g1:
    object_class: EC_16P1G1

  # 16+2 = 18 nodes minimum
  ec_16p2_g1:
    object_class: EC_16P2G1

  # 16+3 = 19 nodes minimum
  ec_16p3_g1:
    object_class: EC_16P3G1
