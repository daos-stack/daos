hosts:
  test_servers: 2
  test_clients: 1

timeout: 600

server_config:
  name: daos_server
  engines_per_host: 1
  engines:
    0:
      targets: 4
      nr_xs_helpers: 0
      storage: auto

pool:
  scm_size: 1G
  properties: rd_fac:0,space_rb:0

container:
  type: POSIX
  properties: cksum:off,srv_cksum:off

block_sizes: [1M, 10M, 100M, 500M]

ior:
  api: POSIX
  flags: "-v -w -k"
  max_duration: 10
