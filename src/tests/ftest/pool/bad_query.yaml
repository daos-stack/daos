hosts:
  test_servers: 1

timeout: 150

server_config:
  name: daos_server
  engines_per_host: 1
  engines:
    0:
      targets: 4
      nr_xs_helpers: 0
      storage:
        0:
          class: ram
          scm_mount: /mnt/daos
  system_ram_reserved: 1

pool:
  scm_size: 1GB
  properties: rd_fac:0,space_rb:0

querytests:
  handles: !mux
    goodhandle:
      handle:
        - VALID
        - PASS
    badhandle:
      handle:
        - 0
        - FAIL
