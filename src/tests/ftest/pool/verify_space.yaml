hosts:
  test_servers: 3
  test_clients: 1

timeout: 750

server_config:
  # Test will require code changes if more than one rank/engine per host
  engines_per_host: 1
  engines:
    0:
      storage: auto

pool_base: &pool_base
  properties: rd_fac:0,space_rb:0

pool_rank_0:
  <<: *pool_base
  size: 100G
  target_list: [0]

pool_rank_1_a:
  <<: *pool_base
  size: 75G
  target_list: [1]

pool_rank_1_b:
  <<: *pool_base
  size: 85G
  target_list: [1]

pool_rank_1_c:
  <<: *pool_base
  size: 95G
  target_list: [1]

pool_rank_1_2:
  <<: *pool_base
  size: 200G
  target_list: [1, 2]

pool_rank_0_1_2:
  <<: *pool_base
  size: 175G
  target_list: [0, 1, 2]

container:
  type: POSIX
  register_cleanup: False
  properties: cksum:off,srv_cksum:off

ior:
  api: DFS
  dfs_chunk: 1048576
  dfs_group: daos_server
  dfs_oclass: SX
  transfer_size: 1M
  flags: '-w -i 1 -k -E'
  signature: 123
