      targets: 4
      nr_xs_helpers: 0
      storage:
        0:
          class: ram
          scm_mount: /mnt/daos
  system_ram_reserved: 1
pool:
  scm_size: 134217728
  properties: rd_fac:4
container:
  type: POSIX
  cont_rf:
    - 0
    - 1
    - 2
    - 3
    - 4
