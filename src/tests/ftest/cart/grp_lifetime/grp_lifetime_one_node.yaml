# change host names to your reserved nodes, the
# required quantity is indicated by the placeholders

ENV:
  default:
    - D_LOG_MASK: "WARN,RPC=DEBUG"
    - D_INTERFACE: "eth0"
env_D_PROVIDER: !mux
  sm:
    D_PROVIDER: "sm"
  ofi_tcp:
    D_PROVIDER: "ofi+tcp"
hosts: !mux
  hosts_1:
    config: one_node
    test_servers: 1
timeout: 600
tests: !mux
  grp_lifetime:
    name: grp_lifetime
    test_servers_bin: crt_launch
    test_servers_arg: "-e no_pmix_grp_lifetime"
    test_servers_env: ""
    test_servers_ppn: "2"
