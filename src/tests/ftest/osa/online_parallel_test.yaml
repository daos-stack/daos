hosts:
  test_servers: server-[1-6]
  test_clients: 1

extra_servers:
  test_servers: server-7

timeout: 1110

job_manager:
  manager_timeout: 400

skip_add_log_msg: true

server_config:
  name: daos_server
  engines_per_host: 2
  engines:
    0:
      pinned_numa_node: 0
      nr_xs_helpers: 1
      log_file: daos_server0.log
      log_mask: DEBUG,MEM=ERR
      env_vars:
        - DD_MASK=mgmt,md,rebuild
      storage: auto
    1:
      pinned_numa_node: 1
      nr_xs_helpers: 1
      log_file: daos_server1.log
      log_mask: DEBUG,MEM=ERR
      env_vars:
        - DD_MASK=mgmt,md,rebuild
      storage: auto

pool:
  scm_size: 12000000000
  nvme_size: 108000000000
  svcn: 4

container:
  type: POSIX
  properties: cksum:crc16,cksum_size:16384,srv_cksum:on,rd_fac:2
  oclass: EC_2P2GX

ior:
  no_parallel_job: 2
  client_processes:
    np: 2
  test_file: /testFile
  repetitions: 10
  dfs_destroy: false
  iorflags:
    write_flags: "-w -F -k -G 1"
    read_flags: "-F -r -R -k -G 1"
    obj_class:
      - "EC_2P2GX"
  ior_test_sequence:
    # - [scmsize, nvmesize, transfersize, blocksize, PASS/FAIL(Expected) ]
    #   The values are set to be in the multiples of 10.
    #   Values are appx GB.
    - [4000000000, 18000000000, 4000, 50000000, PASS]  # [4G, 18G, 4K, 51M, PASS]

daos_racer:
  runtime: 480
  daos_racer_timeout: 1000
