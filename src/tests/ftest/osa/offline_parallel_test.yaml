hosts:
  test_servers: server-[1-6]
  test_clients: 1

extra_servers:
  test_servers: server-7

timeout: 700

setup:
  start_servers_once: false

skip_add_log_msg: true

server_config:
  name: daos_server
  engines_per_host: 2
  engines:
    0:
      pinned_numa_node: 0
      nr_xs_helpers: 1
      log_file: daos_server0.log
      log_mask: DEBUG,MEM=ERR
      env_vars:
        - DD_MASK=mgmt,md,rebuild
      storage: auto
    1:
      pinned_numa_node: 1
      nr_xs_helpers: 1
      log_file: daos_server1.log
      log_mask: DEBUG,MEM=ERR
      env_vars:
        - DD_MASK=mgmt,md,rebuild
      storage: auto

pool:
  size: 60%
  svcn: 3

container:
  type: POSIX
  oclass: EC_2P2GX
  properties: cksum:crc64,cksum_size:16384,srv_cksum:on,rd_fac:2

ior:
  clientslots:
    slots: 48
  test_file: /testFile
  repetitions: 2
  dfs_destroy: false
  iorflags:
    write_flags: "-w -F -k -G 1"
    read_flags: "-F -r -R -k -G 1"
    api: DFS
    dfs_oclass: EC_2P2GX
  ior_test_sequence:
    # - [scmsize, nvmesize, transfersize, blocksize]
    #   The values are set to be in the multiples of 10.
    #   Values are appx GB.
    - [6000000000, 54000000000, 500000, 500000000]

test_obj_class:
  oclass:
    - RP_3GX

loop_test:
  iterations: 3

aggregation:
  test_with_aggregation: true

rebuild:
  test_with_rebuild: true

checksum:
  test_with_checksum: false

system_stop_start:
  flags: true
